# Reusable workflow: render *.demo.yaml files on a virtual display and open a PR with the GIFs.
#
#   jobs:
#     render:
#       uses: bauerdavid/napari-demo-recorder/.github/workflows/render-demos.yml@main
#       with:
#         demos: docs/demos/*.demo.yaml
#       permissions:
#         contents: write
#         pull-requests: write
name: render demos

on:
  workflow_call:
    inputs:
      demos:
        description: Glob(s) of demo files, space separated
        type: string
        default: "**/*.demo.yaml"
      install:
        description: pip install arguments for the project (your plugin)
        type: string
        default: "."
      recorder:
        description: pip spec for napari-demo-recorder ("" if already installed by 'install')
        type: string
        default: napari-demo-recorder
      qt:
        description: Qt binding
        type: string
        default: pyqt6
      python-version:
        type: string
        default: "3.12"
      extra-args:
        description: Extra arguments for 'napari-demo-recorder render'
        type: string
        default: "--check"
      open-pr:
        description: Open a pull request with the rendered files
        type: boolean
        default: true
      branch:
        type: string
        default: update-demo-gifs

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ inputs.python-version }}"}
      - name: Qt system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb gifsicle libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-shape0 libxcb-cursor0 libegl1 libgl1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install -U pip
          pip install ${{ inputs.install }} ${{ inputs.recorder }} ${{ inputs.qt }}
      - name: Render
        shell: bash
        env:
          DEMO_RECORDER_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          shopt -s globstar nullglob
          files=( ${{ inputs.demos }} )
          if [ ${#files[@]} -eq 0 ]; then echo "no demo files match '${{ inputs.demos }}'"; exit 1; fi
          xvfb-run -a -s "-screen 0 1920x1080x24" napari-demo-recorder render ${{ inputs.extra-args }} "${files[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: demos
          path: |
            **/*.gif
            **/*.mp4
          if-no-files-found: ignore
      - name: Pull request
        id: pr
        if: inputs.open-pr
        # New repositories do not allow Actions to open pull requests. Do not fail the run for
        # that: the files are already in the artifact and on the branch; explain the fix instead.
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ inputs.branch }}
          commit-message: Re-render demo GIFs
          title: Re-render demo GIFs
          body: Rendered by [napari-demo-recorder](https://github.com/bauerdavid/napari-demo-recorder) from the `*.demo.yaml` files.
      - name: Explain why no pull request was opened
        if: inputs.open-pr && steps.pr.outcome == 'failure'
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          msg="Could not open a pull request. If the log above says 'GitHub Actions is not permitted to create or approve pull requests', enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests'. The rendered files are in the 'demos' artifact and (if it was pushed) on branch '$BRANCH'."
          echo "::warning title=Demo GIFs rendered, but no pull request::$msg"
          echo "### Demo GIFs rendered, but no pull request was opened" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
