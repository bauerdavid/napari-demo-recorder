name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff
      - run: ruff check src tests examples

  test:
    name: py${{ matrix.python }} napari ${{ matrix.napari }} ${{ matrix.qt }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # napari 0.5 occasionally raises from a background status thread during teardown
          - {python: "3.10", napari: "0.5.6", qt: pyqt5, reruns: "--reruns 1"}
          - {python: "3.12", napari: "latest", qt: pyqt6}
          - {python: "3.13", napari: "latest", qt: pyqt6}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - name: Qt system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb gifsicle libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libxcb-shape0 libxcb-cursor0 libegl1 libgl1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install -U pip
          if [ "${{ matrix.napari }}" = "latest" ]; then NAPARI="napari"; else NAPARI="napari==${{ matrix.napari }}"; fi
          pip install -e ".[testing]" "$NAPARI" ${{ matrix.qt }} scipy pytest-rerunfailures
      - name: Test
        run: xvfb-run -a -s "-screen 0 1920x1080x24" pytest -v --color=yes ${{ matrix.reruns }} --cov=napari_demo_recorder --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: matrix.python == '3.12'
        with: {fail_ci_if_error: false}
